# Secret scanning policy for the repository sweep.
#
# The default rule set is extended, never replaced, and no path is exempt: a
# secret introduced anywhere in the tree still fails the sweep. Every entry
# below either names a value that is already in this repository's history and is
# not a credential, records the single historical binding that holds a
# key-derived test vector, or scopes one obsolete commit that a release
# aggregate still reaches through a merge it later reverted.

title = "OpenGlucose secret scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Known non-secret values, one recorded key-derived fixture binding, and one superseded commit."
regexTarget = "line"
regexes = [
  # macOS self-test storage entry name: a local keychain label, not a credential.
  '''^\s*const testKey = 'ct5[.]macos[.]selftest[.]v1';$''',
  # App Store Connect issuer identifier: an identifier, not a credential. The
  # credential for that API is a private key file that is not in this repository.
  '''API_ISSUER_ID="[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}"''',
  # Test-only fixture defaults in a Dart test helper, bounded to that shape.
  '''^\s*String token = '[A-Za-z0-9_-]{24}',$''',
  # RECORDED, NOT DISMISSED: this binding held a published synthetic masking
  # vector, which is a function of the vendor stream key and therefore material
  # rather than a false positive. It is already public and no scanner setting can
  # un-publish it; the binding is removed from every tip and the tree guard in
  # `security/gitleaks-vendor-material.toml` rejects it or any successor at the
  # tip. Purging the history and rotating the material are decision requests, not
  # something this policy can settle. Bounded to this one binding name.
  '''const _authMasked = ''',
]
# The sensor lane's first redaction commit carried a synthetic, key-shaped test
# fixture. That commit has been rewritten and is no longer a tip, but
# `release/v0.4.0-lane-append` merged it and then reverted the merge, so it is
# still reachable. Bounded to that one commit; the tip guard covers every tip.
commits = ["3be16fc212b699d7e9be1852dcbbac8bec6e3ec0"]
