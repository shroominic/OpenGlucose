name: openglucose
description: Your Open-source health and wellness app focused on local data and privacy.
publish_to: none
version: 0.0.1+9

environment:
  sdk: ^3.11.4
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cgm_aidex:
    path: ../packages/cgm_aidex
  cgm_ble_flutter:
    path: ../packages/cgm_ble_flutter
  cgm_core:
    path: ../packages/cgm_core
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  # Secure on-device storage (iOS Keychain / Android Keystore) for the optional
  # BYO AI API key. The key is never written to SharedPreferences or logged.
  flutter_secure_storage: ^9.2.4
  # Local-first persistence for events / health-samples / AI insights.
  # sqflite chosen over hive/isar: it's relational and query-friendly, so the
  # repository's window/type filtered queries push down to SQL indexes instead
  # of scanning in Dart, it scales to many imported sample rows, and it ships
  # explicit schema-version migration hooks (onCreate/onUpgrade) we need here.
  # It is the lowest-risk, most idiomatic on-device Flutter store and stays
  # fully local (no cloud).
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  # In-process SQLite (FFI) so the sqflite repository runs in `flutter test`
  # on the host with no device/simulator.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
