name: Android Beta Release

on:
  release:
    types:
      - published

concurrency:
  group: android-beta-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  validate:
    name: Validate tagged source
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      asset_name: ${{ steps.release.outputs.asset_name }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate prerelease, tag, version, and main ancestry
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must be strict vMAJOR.MINOR.PATCH; found %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          test "$(jq -r '.immutable' <<<"$release_json")" = false

          version_record=$(sed -n 's/^version: \([0-9][0-9.]*+[0-9][0-9]*\)$/\1/p' openhealth/pubspec.yaml)
          test -n "$version_record"
          version=${version_record%%+*}
          build_number=${version_record##*+}
          test "$RELEASE_TAG" = "v$version"

          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          asset_name="openglucose-$version_record.apk"
          {
            printf 'version=%s\n' "$version"
            printf 'build_number=%s\n' "$build_number"
            printf 'asset_name=%s\n' "$asset_name"
            printf 'release_id=%s\n' "$RELEASE_ID"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify signed APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
      size: ${{ steps.verify.outputs.size }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require complete Android signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_SIGNING_CERT_SHA256; do
            test -n "${!secret_name:-}" || {
              printf 'Required android-release secret %s is missing.\n' "$secret_name" >&2
              exit 1
            }
          done

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: make bootstrap

      - name: Run release checks
        run: make tooling-check format-check lint test-unit test-integration

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/openglucose-release.jks"
          cleanup() {
            rm -f -- "$keystore_path"
          }
          trap cleanup EXIT INT TERM
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$keystore_path"
          test -s "$keystore_path"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_PATH="$keystore_path"
          cd openhealth
          flutter build apk --release --no-pub

      - name: Verify signer, identity, version, and digest
        id: verify
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          RELEASE_ASSET_NAME: ${{ needs.validate.outputs.asset_name }}
        run: |
          set -euo pipefail
          source_apk=openhealth/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$source_apk" "dist/$RELEASE_ASSET_NAME"
          artifact_sha=$(
            sh scripts/verify-android-release-artifact.sh \
              "dist/$RELEASE_ASSET_NAME" \
              "$RELEASE_VERSION" \
              "$RELEASE_BUILD_NUMBER" \
              "$ANDROID_SIGNING_CERT_SHA256"
          )
          printf 'sha256=%s\n' "$artifact_sha" >> "$GITHUB_OUTPUT"
          artifact_size=$(stat -c '%s' "dist/$RELEASE_ASSET_NAME")
          printf 'size=%s\n' "$artifact_size" >> "$GITHUB_OUTPUT"
          printf 'Verified APK SHA-256: %s\n' "$artifact_sha" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: dist/${{ needs.validate.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified APK
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: dist

      - name: Recheck artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          RELEASE_ASSET_NAME: ${{ needs.validate.outputs.asset_name }}
        run: |
          actual_sha=$(sha256sum "dist/$RELEASE_ASSET_NAME" | awk '{print $1}')
          test "$actual_sha" = "$EXPECTED_SHA256"

      - name: Create build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.validate.outputs.asset_name }}

  publish:
    name: Attach verified APK to prerelease
    needs:
      - validate
      - build
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download attested workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: dist

      - name: Attach exact artifact without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          RELEASE_ASSET_NAME: ${{ needs.validate.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          resolve_release_tag_commit() {
            local object_json object_sha object_type depth
            object_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
            object_sha=$(jq -r '.object.sha' <<<"$object_json")
            object_type=$(jq -r '.object.type' <<<"$object_json")
            depth=0
            while test "$object_type" = tag; do
              depth=$((depth + 1))
              test "$depth" -le 4 || {
                printf 'Release tag indirection is unexpectedly deep.\n' >&2
                return 1
              }
              object_json=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
              object_sha=$(jq -r '.object.sha' <<<"$object_json")
              object_type=$(jq -r '.object.type' <<<"$object_json")
            done
            test "$object_type" = commit || {
              printf 'Release tag does not resolve to a commit.\n' >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          asset_path="dist/$RELEASE_ASSET_NAME"
          actual_sha=$(sha256sum "$asset_path" | awk '{print $1}')
          actual_size=$(stat -c '%s' "$asset_path")
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$(resolve_release_tag_commit)" = "$GITHUB_SHA"

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          test "$(jq -r '.immutable' <<<"$release_json")" = false
          if test "$(jq '.assets | length' <<<"$release_json")" -ne 0; then
            printf 'Release already has assets; refusing a non-atomic attachment.\n' \
              >&2
            exit 1
          fi

          encoded_name=$(jq -rn --arg name "$RELEASE_ASSET_NAME" '$name | @uri')
          upload_json=$(gh api --method POST \
            -H 'Content-Type: application/vnd.android.package-archive' \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name" \
            --input "$asset_path")
          uploaded_asset_id=$(jq -r '.id' <<<"$upload_json")
          test "$uploaded_asset_id" != null
          test "$(jq -r '.name' <<<"$upload_json")" = "$RELEASE_ASSET_NAME"
          test "$(jq -r '.state' <<<"$upload_json")" = uploaded
          test "$(jq -r '.size' <<<"$upload_json")" = "$EXPECTED_SIZE"
          test "$(jq -r '.digest' <<<"$upload_json")" = \
            "sha256:$EXPECTED_SHA256"

          test "$(resolve_release_tag_commit)" = "$GITHUB_SHA"

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          test "$(jq '.assets | length' <<<"$release_json")" -eq 1
          asset_json=$(jq '.assets[0]' <<<"$release_json")
          test "$(jq -r '.id' <<<"$asset_json")" = "$uploaded_asset_id"
          test "$(jq -r '.name' <<<"$asset_json")" = "$RELEASE_ASSET_NAME"
          test "$(jq -r '.state' <<<"$asset_json")" = uploaded
          test "$(jq -r '.size' <<<"$asset_json")" = "$EXPECTED_SIZE"
          test "$(jq -r '.digest' <<<"$asset_json")" = \
            "sha256:$EXPECTED_SHA256"
          {
            printf 'Attached %s to %s.\n\n' "$RELEASE_ASSET_NAME" "$RELEASE_TAG"
            printf 'SHA-256: %s\n' "$EXPECTED_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
