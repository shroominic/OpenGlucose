name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked app and resolve package dependencies
        run: make bootstrap

      - name: Check tooling, formatting, and static analysis
        run: make tooling-check format-check lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked app and resolve package dependencies
        run: make bootstrap

      - name: Run unit and widget tests
        run: make test-unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked app and resolve package dependencies
        run: make bootstrap

      - name: Run discovered integration tests
        run: make test-integration

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked app and resolve package dependencies
        run: make bootstrap

      - name: Build debug APK
        run: make build-android

      - name: Verify release signing fails closed
        run: make verify-android-release-signing

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked app and resolve package dependencies
        run: make bootstrap

      - name: Build web demo
        run: make build-web

  ios-build:
    name: iOS Build and Native Tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install pinned CocoaPods
        run: |
          cocoapods_version=$(cat .cocoapods-version)
          cocoapods_root="$RUNNER_TEMP/cocoapods/$cocoapods_version"
          gem install --install-dir "$cocoapods_root" \
            cocoapods -v "$cocoapods_version" --no-document

          actual_cocoapods=$(
            GEM_HOME="$cocoapods_root" \
              GEM_PATH="$cocoapods_root" \
              "$cocoapods_root/bin/pod" --version
          )
          test "$actual_cocoapods" = "$cocoapods_version"

          printf 'GEM_HOME=%s\n' "$cocoapods_root" >> "$GITHUB_ENV"
          printf 'GEM_PATH=%s\n' "$cocoapods_root" >> "$GITHUB_ENV"
          printf '%s\n' "$cocoapods_root/bin" >> "$GITHUB_PATH"

      - name: Restore locked app and resolve package dependencies
        run: make bootstrap

      - name: Build iOS and run native privacy tests
        run: make build-ios test-ios-native
