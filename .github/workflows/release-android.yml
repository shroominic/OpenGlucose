name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing strict vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions: {}

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      asset_name: ${{ steps.release.outputs.asset_name }}
      release_title: ${{ steps.release.outputs.release_title }}
      release_notes: ${{ steps.release.outputs.release_notes }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              github.event_name == 'push' && github.ref || inputs.release_tag
            }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate tag, version, release notes, and main ancestry
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{
              github.event_name == 'push' && github.ref_name ||
              inputs.release_tag
            }}
          RELEASE_EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must be strict vMAJOR.MINOR.PATCH; found %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          version_record=$(sed -n 's/^version: \([0-9][0-9.]*+[0-9][0-9]*\)$/\1/p' openhealth/pubspec.yaml)
          test -n "$version_record"
          version=${version_record%%+*}
          build_number=${version_record##*+}
          test "$RELEASE_TAG" = "v$version"

          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test -n "$tag_commit"
          if test "$RELEASE_EVENT" = push; then
            test "$tag_commit" = "$EVENT_SHA"
          fi
          git fetch origin main --tags
          git merge-base --is-ancestor "$tag_commit" origin/main

          latest_release_tag=$(
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                candidate_commit=$(git rev-list -n 1 "$candidate")
                if git merge-base --is-ancestor \
                  "$candidate_commit" origin/main; then
                  printf '%s\n' "$candidate"
                fi
              fi
            done < <(git tag --list 'v*') | sort -V | tail -n 1
          )
          test "$RELEASE_TAG" = "$latest_release_tag" || {
            printf '%s is not the greatest eligible release tag (%s).\n' \
              "$RELEASE_TAG" "$latest_release_tag" >&2
            exit 1
          }

          release_notes="docs/release-notes/$RELEASE_TAG.md"
          test -s "$release_notes"
          release_title=$(sed -n 's/^# //p' "$release_notes" | head -n 1)
          test -n "$release_title"

          release_matches=$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --paginate |
              jq -s --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]'
          )
          release_count=$(jq 'length' <<<"$release_matches")
          test "$release_count" -le 1 || {
            printf 'Multiple releases use tag %s.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          if test "$release_count" -eq 1; then
            release_json=$(jq '.[0]' <<<"$release_matches")
            test "$(jq -r '.immutable' <<<"$release_json")" = false
            if test "$(jq -r '.draft' <<<"$release_json")" = false; then
              test "$(jq -r '.prerelease' <<<"$release_json")" = false
            fi
          fi

          asset_name="openglucose-$version_record.apk"
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'release_commit=%s\n' "$tag_commit"
            printf 'version=%s\n' "$version"
            printf 'build_number=%s\n' "$build_number"
            printf 'asset_name=%s\n' "$asset_name"
            printf 'release_title=%s\n' "$release_title"
            printf 'release_notes=%s\n' "$release_notes"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify signed APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
      size: ${{ steps.verify.outputs.size }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require complete Android signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_SIGNING_CERT_SHA256; do
            test -n "${!secret_name:-}" || {
              printf 'Required android-release secret %s is missing.\n' "$secret_name" >&2
              exit 1
            }
          done

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: make bootstrap

      - name: Run release checks
        run: make tooling-check format-check lint test-unit test-integration

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/openglucose-release.jks"
          cleanup() {
            rm -f -- "$keystore_path"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$keystore_path"
          test -s "$keystore_path"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_PATH="$keystore_path"
          cd openhealth
          flutter build apk --release --no-pub

      - name: Verify signer, identity, version, and digest
        id: verify
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          RELEASE_ASSET_NAME: ${{ needs.validate.outputs.asset_name }}
        run: |
          set -euo pipefail
          source_apk=openhealth/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$source_apk" "dist/$RELEASE_ASSET_NAME"
          artifact_sha=$(
            sh scripts/verify-android-release-artifact.sh \
              "dist/$RELEASE_ASSET_NAME" \
              "$RELEASE_VERSION" \
              "$RELEASE_BUILD_NUMBER" \
              "$ANDROID_SIGNING_CERT_SHA256"
          )
          printf 'sha256=%s\n' "$artifact_sha" >> "$GITHUB_OUTPUT"
          artifact_size=$(stat -c '%s' "dist/$RELEASE_ASSET_NAME")
          printf 'size=%s\n' "$artifact_size" >> "$GITHUB_OUTPUT"
          printf 'Verified APK SHA-256: %s\n' "$artifact_sha" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: dist/${{ needs.validate.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified APK
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: dist

      - name: Recheck artifact digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          RELEASE_ASSET_NAME: ${{ needs.validate.outputs.asset_name }}
        run: |
          actual_sha=$(sha256sum "dist/$RELEASE_ASSET_NAME" | awk '{print $1}')
          test "$actual_sha" = "$EXPECTED_SHA256"

      - name: Create build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ needs.validate.outputs.asset_name }}

  publish:
    name: Publish verified APK as stable release
    needs:
      - validate
      - build
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download attested workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: dist

      - name: Create hidden draft, attach exact artifact, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.release_commit }}
          RELEASE_TITLE: ${{ needs.validate.outputs.release_title }}
          RELEASE_NOTES: ${{ needs.validate.outputs.release_notes }}
          RELEASE_ASSET_NAME: ${{ needs.validate.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build.outputs.size }}
        run: |
          set -euo pipefail
          resolve_release_tag_commit() {
            local object_json object_sha object_type depth
            object_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
            object_sha=$(jq -r '.object.sha' <<<"$object_json")
            object_type=$(jq -r '.object.type' <<<"$object_json")
            depth=0
            while test "$object_type" = tag; do
              depth=$((depth + 1))
              test "$depth" -le 4 || {
                printf 'Release tag indirection is unexpectedly deep.\n' >&2
                return 1
              }
              object_json=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
              object_sha=$(jq -r '.object.sha' <<<"$object_json")
              object_type=$(jq -r '.object.type' <<<"$object_json")
            done
            test "$object_type" = commit || {
              printf 'Release tag does not resolve to a commit.\n' >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          asset_path="dist/$RELEASE_ASSET_NAME"
          actual_sha=$(sha256sum "$asset_path" | awk '{print $1}')
          actual_size=$(stat -c '%s' "$asset_path")
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$(resolve_release_tag_commit)" = "$RELEASE_COMMIT"
          test -s "$RELEASE_NOTES"

          git fetch origin main --tags
          latest_release_tag=$(
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                candidate_commit=$(git rev-list -n 1 "$candidate")
                if git merge-base --is-ancestor \
                  "$candidate_commit" origin/main; then
                  printf '%s\n' "$candidate"
                fi
              fi
            done < <(git tag --list 'v*') | sort -V | tail -n 1
          )
          test "$RELEASE_TAG" = "$latest_release_tag" || {
            printf '%s is no longer the greatest eligible release tag (%s).\n' \
              "$RELEASE_TAG" "$latest_release_tag" >&2
            exit 1
          }

          release_matches=$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --paginate |
              jq -s --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]'
          )
          release_count=$(jq 'length' <<<"$release_matches")
          test "$release_count" -le 1 || {
            printf 'Multiple releases use tag %s.\n' "$RELEASE_TAG" >&2
            exit 1
          }

          if test "$release_count" -eq 0; then
            create_payload=$(
              jq -n \
                --arg tag "$RELEASE_TAG" \
                --arg commit "$RELEASE_COMMIT" \
                --arg name "$RELEASE_TITLE" \
                --rawfile body "$RELEASE_NOTES" \
                '{
                  tag_name: $tag,
                  target_commitish: $commit,
                  name: $name,
                  body: $body,
                  draft: true,
                  prerelease: false
                }'
            )
            release_json=$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input - <<<"$create_payload")
          else
            release_json=$(jq '.[0]' <<<"$release_matches")
          fi

          release_id=$(jq -r '.id' <<<"$release_json")
          test "$release_id" != null
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.immutable' <<<"$release_json")" = false

          release_is_draft=$(jq -r '.draft' <<<"$release_json")
          if test "$release_is_draft" = false; then
            test "$(jq -r '.prerelease' <<<"$release_json")" = false
          fi

          asset_count=$(jq '.assets | length' <<<"$release_json")
          test "$asset_count" -le 1 || {
            printf 'Release has unexpected extra assets.\n' >&2
            exit 1
          }

          if test "$asset_count" -eq 1; then
            asset_json=$(jq '.assets[0]' <<<"$release_json")
            test "$(jq -r '.name' <<<"$asset_json")" = "$RELEASE_ASSET_NAME"
            asset_state=$(jq -r '.state' <<<"$asset_json")
            if test "$asset_state" = starter; then
              test "$release_is_draft" = true || {
                printf 'Only a hidden draft may discard an incomplete asset.\n' \
                  >&2
                exit 1
              }
              test "$(jq -r '.size' <<<"$asset_json")" = 0 || {
                printf 'Refusing to discard a non-empty starter asset.\n' >&2
                exit 1
              }
              test "$(jq -r '.digest' <<<"$asset_json")" = null || {
                printf 'Refusing to discard a starter asset with a digest.\n' >&2
                exit 1
              }
              asset_id=$(jq -r '.id' <<<"$asset_json")
              test "$asset_id" != null
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              release_json=$(gh api \
                "repos/$GITHUB_REPOSITORY/releases/$release_id")
              test "$(jq '.assets | length' <<<"$release_json")" -eq 0
              asset_count=0
            else
              test "$asset_state" = uploaded
              test "$(jq -r '.size' <<<"$asset_json")" = "$EXPECTED_SIZE"
              test "$(jq -r '.digest' <<<"$asset_json")" = \
                "sha256:$EXPECTED_SHA256"
            fi
          fi

          if test "$asset_count" -eq 0; then
            test "$release_is_draft" = true || {
              printf 'A public release cannot be repaired after publication.\n' >&2
              exit 1
            }

            encoded_name=$(jq -rn \
              --arg name "$RELEASE_ASSET_NAME" '$name | @uri')
            upload_json=$(gh api --method POST \
              -H 'Content-Type: application/vnd.android.package-archive' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded_name" \
              --input "$asset_path")
            uploaded_asset_id=$(jq -r '.id' <<<"$upload_json")
            test "$uploaded_asset_id" != null
            test "$(jq -r '.name' <<<"$upload_json")" = \
              "$RELEASE_ASSET_NAME"
            test "$(jq -r '.state' <<<"$upload_json")" = uploaded
            test "$(jq -r '.size' <<<"$upload_json")" = "$EXPECTED_SIZE"
            test "$(jq -r '.digest' <<<"$upload_json")" = \
              "sha256:$EXPECTED_SHA256"
          fi

          test "$(resolve_release_tag_commit)" = "$RELEASE_COMMIT"

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          test "$(jq -r '.id' <<<"$release_json")" = "$release_id"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 1
          asset_json=$(jq '.assets[0]' <<<"$release_json")
          test "$(jq -r '.name' <<<"$asset_json")" = "$RELEASE_ASSET_NAME"
          test "$(jq -r '.state' <<<"$asset_json")" = uploaded
          test "$(jq -r '.size' <<<"$asset_json")" = "$EXPECTED_SIZE"
          test "$(jq -r '.digest' <<<"$asset_json")" = \
            "sha256:$EXPECTED_SHA256"

          publish_payload=$(
            jq -n \
              --arg name "$RELEASE_TITLE" \
              --rawfile body "$RELEASE_NOTES" \
              '{
                name: $name,
                body: $body,
                draft: false,
                prerelease: false,
                make_latest: "true"
              }'
          )
          release_json=$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --input - <<<"$publish_payload")

          test "$(jq -r '.id' <<<"$release_json")" = "$release_id"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.prerelease' <<<"$release_json")" = false
          test "$(jq '.assets | length' <<<"$release_json")" -eq 1
          asset_json=$(jq '.assets[0]' <<<"$release_json")
          test "$(jq -r '.name' <<<"$asset_json")" = "$RELEASE_ASSET_NAME"
          test "$(jq -r '.state' <<<"$asset_json")" = uploaded
          test "$(jq -r '.size' <<<"$asset_json")" = "$EXPECTED_SIZE"
          test "$(jq -r '.digest' <<<"$asset_json")" = \
            "sha256:$EXPECTED_SHA256"
          test "$(resolve_release_tag_commit)" = "$RELEASE_COMMIT"
          latest_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          test "$(jq -r '.id' <<<"$latest_json")" = "$release_id"
          test "$(jq -r '.tag_name' <<<"$latest_json")" = "$RELEASE_TAG"
          {
            printf 'Published %s with %s.\n\n' \
              "$RELEASE_TAG" "$RELEASE_ASSET_NAME"
            printf 'SHA-256: %s\n' "$EXPECTED_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
