version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: pub
    directory: /openhealth
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /packages/cgm_core
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /packages/cgm_ble
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /packages/cgm_ble_flutter
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /packages/cgm_aidex
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: gradle
    directory: /openhealth/android
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
