min_version: 2.1.9

pre-commit:
  parallel: true
  commands:
    format:
      # Run for every commit. The helper exits quickly when no Dart source is
      # staged, and rejects a staged Dart file outside a configured project.
      # A glob here could otherwise hide an unrecognized staged Dart file.
      run: ./scripts/flutter-workspace.sh format-staged
    analyze:
      glob: "{openhealth,packages}/**/*.{dart,yaml}"
      run: make lint
    tooling:
      glob: "{.github/workflows/*.yml,.github/workflows/*.yaml,scripts/*.sh,openhealth/scripts/*.sh,openhealth/fastlane/Fastfile,Makefile,lefthook.yml,.java-version,.xcode-version,.cocoapods-version,.fastlane-version}"
      run: make tooling-check

pre-push:
  commands:
    check:
      run: make check
